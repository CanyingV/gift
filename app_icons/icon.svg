<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景圆角方块：深咖啡 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#6b4a33"/>

  <!-- 账本右侧书页（浅色页边，露出层次） -->
  <rect x="150" y="118" width="224" height="292" rx="14" fill="#f3ead6"/>
  <rect x="150" y="118" width="224" height="292" rx="14" fill="none" stroke="#d8c9a8" stroke-width="4"/>
  <!-- 页边横线（书写行） -->
  <rect x="182" y="196" width="140" height="7" rx="3.5" fill="#d9c9a6"/>
  <rect x="182" y="230" width="140" height="7" rx="3.5" fill="#d9c9a6"/>
  <rect x="182" y="264" width="104" height="7" rx="3.5" fill="#d9c9a6"/>

  <!-- 账本封面（金色），略窄露出右侧页边 -->
  <rect x="132" y="104" width="212" height="300" rx="16" fill="#d4a24c"/>
  <!-- 封面顶部深色书脊条 -->
  <rect x="132" y="104" width="30" height="300" rx="14" fill="#b9852f"/>
  <!-- 封面内描边 -->
  <rect x="160" y="132" width="156" height="244" rx="8" fill="none" stroke="#b9852f" stroke-width="4"/>

  <!-- 封面标签框（朱红底 + 金色字位） -->
  <rect x="192" y="176" width="92" height="60" rx="8" fill="#b94e33"/>
  <rect x="208" y="196" width="60" height="6" rx="3" fill="#f0c878"/>
  <rect x="208" y="212" width="44" height="6" rx="3" fill="#f0c878"/>

  <!-- 封面书写横线 -->
  <rect x="184" y="276" width="108" height="6" rx="3" fill="#b9852f"/>
  <rect x="184" y="300" width="88" height="6" rx="3" fill="#b9852f"/>
  <rect x="184" y="324" width="98" height="6" rx="3" fill="#b9852f"/>

  <!-- 书签丝带从书顶垂下（避开标签框） -->
  <path d="M320 104 L320 172 L306 154 L292 172 L292 104 Z" fill="#b94e33"/>

  <!-- 旁边的笔：斜靠在账本右侧，笔尖朝下（多边形直接绘制，避免 rotate 渲染问题） -->
  <polygon points="404,182 424,178 444,326 424,330" fill="#8c6647"/>
  <polygon points="404,182 424,178 428,206 408,210" fill="#e8c06a"/>
  <polygon points="424,330 444,326 434,362" fill="#3a2b20"/>
</svg>
