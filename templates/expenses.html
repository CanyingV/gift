<div class="page-head">
    <div><div class="eyebrow"></div><h1>随礼</h1><div class="page-sub"></div></div>
    <div><button class="btn primary" data-action="new-expense"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"></use></svg> 记录随礼</button></div>
</div>
<div class="kpis">{{kpis}}</div>
<section class="card">
    <div class="toolbar">
        <div class="search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"></use></svg><input class="input" id="exp-search" placeholder="搜索姓名" value="{{query}}"></div>
        <select class="select" id="exp-cate"><option value="">分类</option>{{categoryOptions}}</select>
        <select class="select" id="exp-rel"><option value="">关系</option>{{relationOptions}}</select>
        <select class="select" id="exp-sort">{{sortOptions}}</select>
        <span class="muted" style="font-size:12px;margin-left:auto" id="exp-count">{{count}} 条记录</span>
    </div>
    {{listBlock}}
</section>
