name: 打包三端安装包

# 手动触发；也可在推送 tag（如 v1.0.0）时自动构建
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-exe:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pyinstaller pywebview
      - name: 打包 exe
        run: pyinstaller desktop.spec --noconfirm
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 礼单管家-Windows-exe
          path: dist/礼单管家.exe

  build-dmg:
    name: macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pyinstaller pywebview
      - name: 打包 app
        run: pyinstaller desktop.spec --noconfirm
      - name: 制作 dmg
        run: |
          hdiutil create -volname "礼单管家" \
            -srcfolder "dist/礼单管家.app" \
            -ov -format UDZO "dist/礼单管家.dmg"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 礼单管家-macOS-dmg
          path: dist/礼单管家.dmg

  build-apk:
    name: Android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3
      - name: 授予 Gradle 执行权限
        run: chmod +x android/gradlew
      - name: 构建 apk
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 礼单管家-Android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
