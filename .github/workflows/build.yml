name: 打包三端安装包

# 手动触发；也可在推送 tag（如 v1.0.0）时自动构建
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-exe:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pyinstaller pywebview
      - name: 打包 exe
        run: pyinstaller desktop.spec --noconfirm
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 礼单管家-Windows-exe
          path: dist/礼单管家.exe

  build-dmg:
    name: macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pyinstaller pywebview
      - name: 打包 app
        run: pyinstaller desktop.spec --noconfirm
      - name: 制作 dmg
        run: |
          hdiutil create -volname "礼单管家" \
            -srcfolder "dist/礼单管家.app" \
            -ov -format UDZO "dist/礼单管家.dmg"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 礼单管家-macOS-dmg
          path: dist/礼单管家.dmg

  build-apk:
    name: Android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest 已预装 Android SDK，不要再跑 setup-android@v3：
      # 它会安装已下线的 'tools' 包并导致 sdkmanager 失败。
      - name: 准备 Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            || echo "部分组件已存在或无需安装，交由 Gradle 处理"
      - name: 授予 Gradle 执行权限
        run: chmod +x android/gradlew
      - name: 构建 apk
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 礼单管家-Android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: 发布 Release
    needs: [build-exe, build-dmg, build-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 列出产物
        run: ls -lh dist
      - name: 发布到 Release（公开下载）
        uses: softprops/action-gh-release@v2
        with:
          name: 礼单管家 ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 礼单管家 ${{ github.ref_name }}

            三个平台的安装包：

            - **Windows**：下载 `礼单管家.exe` 双击安装
            - **macOS**：下载 `礼单管家.dmg`，打开后拖入「应用程序」；首次打开若被拦截，去「系统设置 → 隐私与安全性」点「仍要打开」
            - **Android**：下载 `app-debug.apk` 传到手机安装（需允许安装未知来源应用；debug 签名，仅供自行使用）

            数据保存在本机，安装包内置初始示例数据。
          files: |
            dist/礼单管家.exe
            dist/礼单管家.dmg
            dist/app-debug.apk
          fail_on_unmatched_files: false
